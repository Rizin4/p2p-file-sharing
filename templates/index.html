<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropCode</title>
  <link rel="icon" href='data:image/svg+xml,
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="48">🔗</text>
</svg>'>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
  <main>
    <header>
      <h1>DROPCODE</h1>
      <p class="subtitle">Direct file upload. Six digit pickup code.</p>
    </header>

    <div class="setup-warning" id="setupWarning">
      Supabase environment variables are missing. Add them before uploading files.
    </div>

    <div class="tabs" role="tablist" aria-label="DropCode actions">
      <button class="tab active" type="button" id="sendTab" onclick="switchTab('send')">SEND</button>
      <button class="tab" type="button" id="receiveTab" onclick="switchTab('receive')">RECEIVE</button>
    </div>

    <section class="panel active" id="sendPanel">
      <label class="drop-zone" id="dropZone">
        <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor"
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm0 2.5L17.5 8H14zM7 13h3v-2h4v2h3l-5 5z" />
        </svg>
        <span>Drop file here or click to select</span>
        <span class="hint">PDF, images, ZIPs, text, code, and other files</span>
        <span class="file-name" id="fileName"></span>
        <input type="file" id="fileInput" onchange="onFileSelect(this)">
      </label>

      <div class="progress" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <button class="primary" id="uploadBtn" type="button" onclick="uploadFile()" disabled>
        GENERATE CODE
      </button>
      <div class="status" id="sendStatus"></div>

      <div id="codeBox" hidden>
        <div class="code-display">
          <div class="label">Share this code</div>
          <div class="code" id="generatedCode">000000</div>
          <div class="timer" id="timerDisplay">Expires in 5:00</div>
          <button class="copy-btn" type="button" onclick="copyCode()">COPY CODE</button>
        </div>
      </div>
    </section>

    <section class="panel" id="receivePanel">
      <input class="code-input" id="codeInput" type="text" inputmode="numeric" maxlength="6" placeholder="000000"
        autocomplete="one-time-code" oninput="onCodeInput(this)">
      <button class="primary" type="button" onclick="verifyCode()">VERIFY CODE</button>

      <div class="file-preview" id="filePreview" hidden>
        <div class="file-preview-icon" id="filePreviewIcon" aria-hidden="true"></div>
        <div class="file-preview-name" id="filePreviewName"></div>
        <button class="download-btn" type="button" onclick="triggerDownload()" aria-label="Download file">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v12 M7 11l5 5 5-5 M5 20h14" />
          </svg>
          <span>DOWNLOAD</span>
        </button>
      </div>

      <div class="status" id="receiveStatus"></div>
    </section>
  </main>

  <script>
    let sb = null;
    let configured = false;
    let bucket = "files";
    let expirySeconds = 300;
    let selectedFile = null;
    let countdownInterval = null;

    initConfig();

    async function initConfig() {
      const warning = document.getElementById("setupWarning");

      if (!window.supabase) {
        warning.textContent = "Supabase browser SDK did not load. Check your internet connection or allow cdn.jsdelivr.net.";
        warning.style.display = "block";
        return;
      }

      try {
        const response = await fetch("/api/config");
        if (!response.ok) throw new Error("Could not load app config");

        const config = await response.json();
        configured = Boolean(config.configured);
        bucket = config.bucket || bucket;
        expirySeconds = Number(config.expiry_seconds || expirySeconds);

        if (!configured) {
          warning.textContent = "Supabase environment variables are missing. Run the app through Flask and check your .env file.";
          warning.style.display = "block";
          return;
        }

        sb = window.supabase.createClient(config.supabase_url, config.supabase_anon_key);
        warning.style.display = "none";
        updateUploadButton();
      } catch (error) {
        warning.textContent = "Open this app at http://127.0.0.1:5000, not by opening templates/index.html directly.";
        warning.style.display = "block";
      }
    }

    function switchTab(tab) {
      document.getElementById("sendTab").classList.toggle("active", tab === "send");
      document.getElementById("receiveTab").classList.toggle("active", tab === "receive");
      document.getElementById("sendPanel").classList.toggle("active", tab === "send");
      document.getElementById("receivePanel").classList.toggle("active", tab === "receive");
    }

    function onFileSelect(input) {
      setSelectedFile(input.files[0]);
    }

    function setSelectedFile(file) {
      selectedFile = file || null;
      document.getElementById("fileName").textContent = selectedFile ? selectedFile.name : "";
      document.getElementById("codeBox").hidden = true;
      document.getElementById("progressBar").style.width = "0%";
      updateUploadButton();
    }

    function updateUploadButton() {
      document.getElementById("uploadBtn").disabled = !selectedFile;
    }

    const dropZone = document.getElementById("dropZone");
    dropZone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropZone.classList.add("drag");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag"));
    dropZone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropZone.classList.remove("drag");
      setSelectedFile(event.dataTransfer.files[0]);
    });

    async function uploadFile() {
      const button = document.getElementById("uploadBtn");
      const status = document.getElementById("sendStatus");
      const bar = document.getElementById("progressBar");

      if (!selectedFile) {
        status.className = "status err";
        status.textContent = "SELECT A FILE FIRST";
        return;
      }

      if (!configured || !sb) {
        status.className = "status err";
        status.textContent = "APP CONFIG IS NOT READY. USE http://127.0.0.1:5000 AND CHECK /api/health.";
        return;
      }

      button.disabled = true;
      status.className = "status";
      status.textContent = "UPLOADING...";
      bar.style.width = "20%";

      const safeName = selectedFile.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const path = `uploads/${Date.now()}_${crypto.randomUUID()}_${safeName}`;

      try {
        const { error: uploadError } = await sb.storage
          .from(bucket)
          .upload(path, selectedFile, {
            cacheControl: "3600",
            upsert: false
          });

        if (uploadError) throw new Error(uploadError.message);
        bar.style.width = "70%";

        const response = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: selectedFile.name, storage_path: path })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not generate code");

        document.getElementById("generatedCode").textContent = data.code;
        document.getElementById("codeBox").hidden = false;
        status.className = "status ok";
        status.textContent = "FILE READY";
        bar.style.width = "100%";
        startCountdown(expirySeconds);
      } catch (error) {
        status.className = "status err";
        const message = error.message || "Upload failed";
        if (message.toLowerCase().includes("row-level security")) {
          status.textContent = "UPLOAD BLOCKED: add the anon INSERT storage policy for the files bucket.";
        } else {
          status.textContent = `ERROR: ${message}`;
        }
        button.disabled = false;
        bar.style.width = "0%";
      }
    }

    function startCountdown(seconds) {
      clearInterval(countdownInterval);
      const timer = document.getElementById("timerDisplay");

      function render() {
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = String(seconds % 60).padStart(2, "0");
        timer.textContent = `Expires in ${minutes}:${remainingSeconds}`;

        if (seconds <= 0) {
          clearInterval(countdownInterval);
          timer.textContent = "Expired. Upload again.";
          document.getElementById("generatedCode").textContent = "000000";
          return;
        }

        seconds -= 1;
      }

      render();
      countdownInterval = setInterval(render, 1000);
    }

    const FILE_ICON_BASE =
      '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />' +
      '<path d="M14 3v6h6" />';

    const FILE_ICONS = {
      image: FILE_ICON_BASE +
        '<circle cx="9" cy="13" r="1.2" />' +
        '<path d="M7 19l3.5-3.5 2 2 3-3.5 4.5 5" />',
      video: FILE_ICON_BASE +
        '<path d="M10 13.5v5l4.5-2.5z" />',
      audio: FILE_ICON_BASE +
        '<path d="M10 19v-6l6-1.5v6" />' +
        '<circle cx="9.2" cy="19" r="1.3" />' +
        '<circle cx="15.2" cy="17.5" r="1.3" />',
      pdf: FILE_ICON_BASE +
        '<text x="7" y="19" font-family="Courier New, monospace" font-size="5.2" font-weight="700" stroke="none" fill="currentColor">PDF</text>',
      doc: FILE_ICON_BASE +
        '<path d="M8 13h8 M8 16h8 M8 19h5" />',
      spreadsheet: FILE_ICON_BASE +
        '<path d="M7 13h10 M7 16h10 M7 19h10 M12 13v6" />',
      presentation: FILE_ICON_BASE +
        '<path d="M8 19v-3 M11.5 19v-5 M15 19v-2.5 M18 19v-4" />',
      archive: FILE_ICON_BASE +
        '<path d="M12 9v3 M12 14v1.5 M12 17.5v1.5" />',
      code: FILE_ICON_BASE +
        '<path d="M10 14l-2.5 2.5L10 19 M14 14l2.5 2.5L14 19" />',
      text: FILE_ICON_BASE +
        '<path d="M8 13h8 M8 16h8 M8 19h6" />',
      default: FILE_ICON_BASE,
    };

    const EXT_TO_CATEGORY = {
      jpg: "image", jpeg: "image", png: "image", gif: "image", webp: "image",
      svg: "image", bmp: "image", ico: "image", heic: "image", heif: "image", avif: "image",
      mp4: "video", mov: "video", mkv: "video", webm: "video", avi: "video",
      m4v: "video", wmv: "video", flv: "video",
      mp3: "audio", wav: "audio", ogg: "audio", flac: "audio", m4a: "audio",
      aac: "audio", opus: "audio",
      pdf: "pdf",
      doc: "doc", docx: "doc", odt: "doc", rtf: "doc", pages: "doc",
      xls: "spreadsheet", xlsx: "spreadsheet", csv: "spreadsheet", tsv: "spreadsheet",
      ods: "spreadsheet", numbers: "spreadsheet",
      ppt: "presentation", pptx: "presentation", odp: "presentation", key: "presentation",
      zip: "archive", rar: "archive", "7z": "archive", tar: "archive",
      gz: "archive", tgz: "archive", bz2: "archive", xz: "archive",
      js: "code", jsx: "code", ts: "code", tsx: "code", py: "code", java: "code",
      c: "code", h: "code", cpp: "code", hpp: "code", cs: "code", go: "code",
      rs: "code", rb: "code", php: "code", swift: "code", kt: "code", sh: "code",
      bash: "code", sql: "code", yml: "code", yaml: "code", json: "code",
      xml: "code", html: "code", css: "code", scss: "code", sass: "code",
      less: "code", vue: "code", svelte: "code",
      txt: "text", md: "text", log: "text",
    };

    let pendingDownload = null;

    function getFileIconHTML(filename) {
      const dot = filename.lastIndexOf(".");
      const ext = dot > 0 ? filename.slice(dot + 1).toLowerCase() : "";
      const category = EXT_TO_CATEGORY[ext] || "default";
      return '<svg viewBox="0 0 24 24" aria-hidden="true">' + FILE_ICONS[category] + "</svg>";
    }

    function clearPreview() {
      pendingDownload = null;
      const preview = document.getElementById("filePreview");
      preview.hidden = true;
      document.getElementById("filePreviewIcon").innerHTML = "";
      document.getElementById("filePreviewName").textContent = "";
    }

    function onCodeInput(input) {
      input.value = input.value.replace(/\D/g, "");
      clearPreview();
      const status = document.getElementById("receiveStatus");
      status.className = "status";
      status.textContent = "";
    }

    async function verifyCode() {
      const code = document.getElementById("codeInput").value.trim();
      const status = document.getElementById("receiveStatus");

      clearPreview();

      if (code.length !== 6) {
        status.className = "status err";
        status.textContent = "ENTER A 6-DIGIT CODE";
        return;
      }

      status.className = "status";
      status.textContent = "VERIFYING...";

      try {
        const response = await fetch("/api/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not verify code");

        pendingDownload = { url: data.download_url, filename: data.filename };
        document.getElementById("filePreviewIcon").innerHTML = getFileIconHTML(data.filename);
        document.getElementById("filePreviewName").textContent = data.filename;
        document.getElementById("filePreview").hidden = false;

        status.className = "status";
        status.textContent = "";
      } catch (error) {
        status.className = "status err";
        status.textContent = `ERROR: ${error.message}`;
      }
    }

    function triggerDownload() {
      if (!pendingDownload) return;
      const link = document.createElement("a");
      link.href = pendingDownload.url;
      link.download = pendingDownload.filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    async function copyCode() {
      const code = document.getElementById("generatedCode").textContent;
      await navigator.clipboard.writeText(code);

      const button = document.querySelector(".copy-btn");
      button.textContent = "COPIED";
      setTimeout(() => {
        button.textContent = "COPY CODE";
      }, 1600);
    }
  </script>
</body>

</html>
